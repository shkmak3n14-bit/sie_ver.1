meta:
  id: enneagram_foundation
  version: "1.0.0"
  purpose: "エニアグラムの基礎 → 応用 → 実用 → サイの意義"
  description: "診断前に利用者へ伝える1ページ完結のエニアグラム基礎説明"

hero:
  title: "サイ：エニアグラム基礎ページ"
  tagline: "あなたと相手の“無意識の動機”を理解し、関係改善を支援するAI ― サイ"
  lead:
    - "人は、価値観・恐れ・欲求の違いから、誤解や衝突が生まれます。"
    - "サイは、エニアグラムを使ってあなたと相手の反応パターンを理解し、より良い関係を築くための補助線を引くAIです。"
  note: "診断は「あなたを分類するため」ではなく、あなたと相手が同じ方向を見るための地図をつくるために行います。"

sections:
  - id: what_is_enneagram
    number: 1
    title: "エニアグラムとは"
    paragraphs:
      - "エニアグラムは、人が何かを選ぶときの“無意識の動機”と反応パターンを理解するための心理モデルです。"
    bullets:
      - "9つのタイプは「性格」ではなく「反応のクセ」"
      - "行動そのものではなく、その背後にある“動機”を扱う"
      - "自己理解・対人関係・組織開発などで広く使われている"
      - "MBTIは認知傾向、エニアグラムは動機（違いはこの一言で十分）"
    closing: "エニアグラムは「人を分類するため」ではなく、自分と他者の“衝突の理由”を理解するための地図です。"

  - id: nine_types
    number: 2
    title: "9つのタイプ（概要）"
    paragraphs:
      - "ここでは、全体像だけを簡潔に示します。"
      - "詳細は診断後にサイがあなた専用に説明します。"
    type_list:
      - "完全でありたい人"
      - "助けたい人"
      - "成功したい人"
      - "特別でありたい人"
      - "理解したい人"
      - "安心したい人"
      - "楽しみたい人"
      - "自分を守りたい人"
      - "平和でありたい人"

  - id: three_centers
    number: 3
    title: "人間の配向性（3センター）"
    paragraphs:
      - "人は、意思決定の際に「どのセンターが優位か」で反応の方向性が変わります。"
    centers:
      - name: "本能センター（Gut）"
        description: "安全・行動・身体感覚を重視する"
      - name: "感情センター（Heart）"
        description: "関係性・価値・承認を重視する"
      - name: "思考センター（Head）"
        description: "理解・計画・予測を重視する"
    closing: "どのセンターが優位かによって、「何を優先して判断するか」が大きく変わります。"

  - id: integration_disintegration
    number: 4
    title: "成長方向・退行方向（矢印）"
    paragraphs:
      - "エニアグラムのタイプは固定ではなく、状況によって“動き”ます。"
    arrows:
      - label: "安定しているとき（統合方向）"
        description: "他タイプの良い性質が自然に出る"
      - label: "ストレス時（分裂方向）"
        description: "他タイプの弱い性質が出やすくなる"
    closing: "この「矢印の動き」は、好循環・悪循環の理解や、関係改善のヒントになります。"

  - id: wing
    number: 5
    title: "ウイング（隣接タイプの影響）"
    paragraphs:
      - "メインタイプの左右にあるタイプが、その人の“色合い”や“雰囲気”を補助的に形づくります。"
    bullets:
      - "ウイングは補助的傾向"
      - "メインタイプの本質が変わるわけではない"
      - "診断結果は「タイプ＋ウイング」で表現されます。"

  - id: subtypes
    number: 6
    title: "サブタイプ（SP / SO / SX）"
    paragraphs:
      - "同じタイプでも、行動の優先順位が大きく異なることがあります。"
      - "それを説明するのが「本能サブタイプ」です。"
    subtypes:
      - code: "SP"
        label: "自己保存（SP）"
        description: "安全・安定・生活基盤"
      - code: "SO"
        label: "対人（SO）"
        description: "集団・役割・社会的つながり"
      - code: "SX"
        label: "一対一（SX）"
        description: "親密・集中・深い関係"
    closing: "サブタイプは、「どの場面でどんな行動が出やすいか」を理解する助けになります。"

  - id: usage_history
    number: 7
    title: "エニアグラムの利用実績"
    paragraphs:
      - "エニアグラムは、以下の領域で長く使われてきました。"
    bullets:
      - "組織開発"
      - "コーチング"
      - "カウンセリング"
      - "対人関係改善"
      - "コンフリクトマネジメント"
      - "リーダーシップ育成"
    closing: "「動機」を扱うため、人間関係の改善や衝突の理解に強いモデルです。"

  - id: limitations
    number: 8
    title: "診断の限界と注意点"
    paragraphs:
      - "サイの診断は、あなたを決めつけるためのものではありません。"
      - "誤解を避けるために、以下だけ押さえてください。"
    bullets:
      - "診断は確率的推定であり、断定ではない"
      - "「こう見られたい自分」ではなく「実際の反応」で答える"
      - "違和感があれば必ずサイに伝えてよい"
      - "子どもの頃の反応はタイプ理解のヒントになる"
    closing: "サイは、あなたの違和感を最優先します。"

  - id: sie_design
    number: 9
    title: "サイの設計思想"
    paragraphs:
      - "サイは、あなたと相手の“無意識の動機”を理解し、関係改善を支援するAIです。"
    bullets:
      - "エニアグラムは「衝突の理由」を理解するための地図"
      - "サイはその地図を使い、あなたと相手の反応パターンを整理する"
      - "サイはタイプを決めるAIではなく関係改善のための観点を提示するAI"
      - "診断は「あなたの可能性を狭めるためではなく、広げるため」"
    closing: "あなたと相手が“同じ方向を見るための補助線”を引くこと。それがサイの役割です。"

cta:
  title: "診断を始める"
  body:
    - "あなた自身の反応パターンを理解し、より良い関係を築くための第一歩を踏み出しましょう。"
  button: "診断を始める"

type: 6
name: "忠実な人"
center: head
questions:
  - id: T6_01
    text: "最悪の事態を想定して、備えることが多い"
  - id: T6_02
    text: "信頼できる人やグループに属していると安心する"
  - id: T6_03
    text: "不確実な状況は、不安を感じやすい"
  - id: T6_04
    text: "権威やルールが明確だと、動きやすい"
  - id: T6_05
    text: "約束や忠誠は、関係の基盤だと思う"
  - id: T6_06
    text: "疑問や懸念を口にして、確認したくなる"
  - id: T6_07
    text: "安全策を複数用意しておくと落ち着く"
  - id: T6_08
    text: "裏切りや裏切られることへの恐れがある"
  - id: T6_09
    text: "決断する前に、十分な情報と保証が欲しい"
  - id: T6_10
    text: "リスクのある選択は、慎重になる"
  - id: T6_11
    text: "所属する共同体の価値観に共感したい"
  - id: T6_12
    text: "不安な時、信頼できる人に相談したくなる"
  - id: T6_13
    text: "ルールを破る人に対して、警戒心を持つことがある"
  - id: T6_14
    text: "責任ある立場では、期待に応えようとする"
  - id: T6_15
    text: "安心できる「拠り所」がないと、落ち着かない"

type: 5
name: "調べる人"
center: head
questions:
  - id: T5_01
    text: "理解するまで、観察して距離を取ることが多い"
  - id: T5_02
    text: "一人の時間でエネルギーを回復する"
  - id: T5_03
    text: "知識や情報を集めることに安心感を覚える"
  - id: T5_04
    text: "感情より、事実や論理を優先しがちだ"
  - id: T5_05
    text: "プライベートや境界線を大切にする"
  - id: T5_06
    text: "十分に準備できないと、行動に移しにくい"
  - id: T5_07
    text: "人との関わりは、エネルギーを消耗させると感じる"
  - id: T5_08
    text: "専門分野に深く没頭できる"
  - id: T5_09
    text: "感情を言葉にするより、内面で処理しがちだ"
  - id: T5_10
    text: "頼られるより、自立している方が楽だ"
  - id: T5_11
    text: "無駄な社交より、意味のある交流を選ぶ"
  - id: T5_12
    text: "世界を理解したい、という欲求が強い"
  - id: T5_13
    text: "要求や期待が多い関係は避けたいと感じる"
  - id: T5_14
    text: "感情の波より、冷静な分析を信頼する"
  - id: T5_15
    text: "自分の内側に、安全な「観察室」があるような感覚がある"

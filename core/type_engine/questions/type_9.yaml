type: 9
name: "平和を求める人"
center: gut
questions:
  - id: T9_01
    text: "争いより、調和を選びたい"
  - id: T9_02
    text: "自分の意見より、全体の平和を優先しがちだ"
  - id: T9_03
    text: "対立が起きると、居心地が悪くなる"
  - id: T9_04
    text: "他人の視点も理解でき、どちらも一理あると感じる"
  - id: T9_05
    text: "自分の欲求が何か、はっきりしないことがある"
  - id: T9_06
    text: "穏やかな日常を乱す変化は、抵抗感がある"
  - id: T9_07
    text: "優先順位を決めるより、流れに任せることが多い"
  - id: T9_08
    text: "怒りや不満を、内側に溜め込みがちだ"
  - id: T9_09
    text: "受け入れられ、受け入れる関係を大切にする"
  - id: T9_10
    text: "他人のペースに合わせて、自分を後回しにすることがある"
  - id: T9_11
    text: "決断を先延ばしにして、現状維持を選びがちだ"
  - id: T9_12
    text: "複数の選択肢があっても、決めきれないことがある"
  - id: T9_13
    text: "穏やかな雰囲気を作るのが得意だ"
  - id: T9_14
    text: "自分の意見を言うと、関係が壊れそうで怖い"
  - id: T9_15
    text: "惰性で続けていることに、気づくことがある"

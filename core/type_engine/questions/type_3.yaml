type: 3
name: "成功を目指す人"
center: heart
questions:
  - id: T3_01
    text: "目標を達成すると、自分の価値を実感する"
  - id: T3_02
    text: "効率的に成果を出すことに注力する"
  - id: T3_03
    text: "他人からどう見られるか、意識することが多い"
  - id: T3_04
    text: "成功のイメージを持ち、それに近づこうとする"
  - id: T3_05
    text: "忙しく動いている方が、自分らしいと感じる"
  - id: T3_06
    text: "失敗や停滞は、避けたいと感じる"
  - id: T3_07
    text: "競争の中で力を発揮しやすい"
  - id: T3_08
    text: "結果で自分を証明したい気持ちがある"
  - id: T3_09
    text: "感情より、達成可能な計画を優先しがちだ"
  - id: T3_10
    text: "評価や称賛があると、モチベーションが上がる"
  - id: T3_11
    text: "イメージや見せ方も、成果の一部だと思う"
  - id: T3_12
    text: "時間を無駄にすることが、もったいないと感じる"
  - id: T3_13
    text: "適応力があり、状況に合わせて自分を変えられる"
  - id: T3_14
    text: "弱みを見せるより、強さを見せたいと感じる"
  - id: T3_15
    text: "やる気が出ない時、成果のイメージで自分を鼓舞する"

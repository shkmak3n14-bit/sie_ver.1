type: 1
name: "改革する人"
center: gut
questions:
  - id: T1_01
    text: "物事には正しいやり方があると感じることが多い"
  - id: T1_02
    text: "自分にも他人にも、一定の基準を守ってほしい"
  - id: T1_03
    text: "ミスや不正を見ると、放っておけない"
  - id: T1_04
    text: "改善の余地がない状態は、落ち着かない"
  - id: T1_05
    text: "義務感が強く、やるべきことは後回しにしにくい"
  - id: T1_06
    text: "自分の内側に「厳しい批判者」がいる感覚がある"
  - id: T1_07
    text: "正しさのために、言いにくいことも言う方だ"
  - id: T1_08
    text: "秩序やルールが乱れるとストレスを感じる"
  - id: T1_09
    text: "完璧に近づけないと、満足しにくい"
  - id: T1_10
    text: "他人の怠慢や怠慢に見える行動にイラッとすることがある"
  - id: T1_11
    text: "理想と現実のギャップに苛立ちを感じる"
  - id: T1_12
    text: "正しい判断のために、感情より原則を優先しがちだ"
  - id: T1_13
    text: "自分の行動に一貫性と誠実さを求める"
  - id: T1_14
    text: "改善提案をするのは、相手への配慮より正しさのためだと感じる"
  - id: T1_15
    text: "間違いを指摘されると、防御的になりやすい"

type: 2
name: "奉仕する人"
center: heart
questions:
  - id: T2_01
    text: "誰かの役に立てると、自分も元気になる"
  - id: T2_02
    text: "必要とされないと、存在価値を感じにくい"
  - id: T2_03
    text: "相手の気持ちやニーズを察するのが得意だ"
  - id: T2_04
    text: "助けを求められないうちに、先回りして手を差し伸べる"
  - id: T2_05
    text: "感謝や好意の表現がもらえると嬉しい"
  - id: T2_06
    text: "自分の欲求より、相手のことを優先しがちだ"
  - id: T2_07
    text: "拒絶されると、深く傷つきやすい"
  - id: T2_08
    text: "人間関係の調和のために、自分を抑えることがある"
  - id: T2_09
    text: "誰かの世話をしていると、充実感を覚える"
  - id: T2_10
    text: "本音より、相手が喜ぶことを言うことがある"
  - id: T2_11
    text: "頼まれないと、距離を感じて不安になる"
  - id: T2_12
    text: "親密さは、お互いのためになる行動で深まると思う"
  - id: T2_13
    text: "自分の疲れより、相手の困りごとを優先しがちだ"
  - id: T2_14
    text: "愛情表現は、言葉より行動で示す方だ"
  - id: T2_15
    text: "自分の本当の気持ちを言うより、関係を保つことを選びがちだ"

type: 8
name: "挑戦する人"
center: gut
questions:
  - id: T8_01
    text: "弱さを見せるより、強さで自分を守りたい"
  - id: T8_02
    text: "不正や理不尽には、正面から立ち向かう"
  - id: T8_03
    text: "コントロールを失うと、イライラしやすい"
  - id: T8_04
    text: "率直に物事を言う方だ"
  - id: T8_05
    text: "弱い立場の人を守りたいという衝動がある"
  - id: T8_06
    text: "依存されるより、頼られる方が自然だ"
  - id: T8_07
    text: "対立を恐れず、必要なら衝突も選ぶ"
  - id: T8_08
    text: "力と公正さは、セットだと思う"
  - id: T8_09
    text: "感情を抑え込むより、エネルギー全開で動く"
  - id: T8_10
    text: "支配される状況は、耐えがたい"
  - id: T8_11
    text: "決断は速く、実行も速い方だ"
  - id: T8_12
    text: "信頼できる相手には、強い忠誠心を示す"
  - id: T8_13
    text: "脆弱さを見せることへの抵抗感がある"
  - id: T8_14
    text: "自分の領域や境界線を明確にする"
  - id: T8_15
    text: "力のある人には敬意を、弱い振る舞いには苛立ちを感じやすい"

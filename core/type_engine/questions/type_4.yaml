type: 4
name: "個性を求める人"
center: heart
questions:
  - id: T4_01
    text: "自分は他人と根本的に違う、と感じることがある"
  - id: T4_02
    text: "深い感情や意味のある体験を大切にする"
  - id: T4_03
    text: "平凡な日常より、特別な瞬間に惹かれる"
  - id: T4_04
    text: "何かが足りない、という感覚を抱えることがある"
  - id: T4_05
    text: "本物らしさや誠実さに敏感だ"
  - id: T4_06
    text: "他人と比較すると、自分だけ劣っている気がすることがある"
  - id: T4_07
    text: "感情の起伏が大きく、内面世界が豊かだ"
  - id: T4_08
    text: "表面的な付き合いより、深い理解を求める"
  - id: T4_09
    text: "美しさや独自性に強く惹かれる"
  - id: T4_10
    text: "理解されない孤独感を感じることがある"
  - id: T4_11
    text: "自分らしさを失うことへの恐れがある"
  - id: T4_12
    text: "悲しみや郷愁も、自分の一部として大切にする"
  - id: T4_13
    text: "ありのままの自分を見せたいが、傷つくのも怖い"
  - id: T4_14
    text: "意味のない行動より、魂のこもった選択をしたい"
  - id: T4_15
    text: "他人の成功を見ると、複雑な感情が湧くことがある"

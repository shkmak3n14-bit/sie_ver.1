type: 7
name: "熱中する人"
center: head
questions:
  - id: T7_01
    text: "新しい体験や選択肢があると、ワクワクする"
  - id: T7_02
    text: "退屈や制限が続くと、居心地が悪い"
  - id: T7_03
    text: "ネガティブな感情は、別の楽しいことで切り替えたくなる"
  - id: T7_04
    text: "将来の可能性を考えると、エネルギーが湧く"
  - id: T7_05
    text: "一つのことに縛られるより、自由を選びたい"
  - id: T7_06
    text: "計画より、流れに乗って動くことが多い"
  - id: T7_07
    text: "楽しさや面白さが、行動の原動力だ"
  - id: T7_08
    text: "制限や義務を感じると、逃げたくなる"
  - id: T7_09
    text: "複数の興味を同時に追いかけることがある"
  - id: T7_10
    text: "悲しみや苦痛に長く留まるのは苦手だ"
  - id: T7_11
    text: "最善のシナリオを想像する方が得意だ"
  - id: T7_12
    text: "人を楽しませると、自分も嬉しい"
  - id: T7_13
    text: "決断を先延ばしにして、選択肢を残したくなる"
  - id: T7_14
    text: "刺激がない日常は、窮屈に感じる"
  - id: T7_15
    text: "制約の中でも、楽しみ方を見つけようとする"

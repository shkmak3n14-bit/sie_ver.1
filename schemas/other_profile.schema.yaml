# other_understanding 出力スキーマ

type: object
required:
  - module
  - disclaimer
  - estimated_type_candidates
  - their_values

properties:
  module:
    const: other_understanding
  disclaimer:
    const: "相手本人の診断ではない推定結果です"
  episodes_analyzed:
    type: integer
    minimum: 4
    maximum: 5
  estimated_type_candidates:
    type: array
    items:
      type: object
      properties:
        type: { type: integer, minimum: 1, maximum: 9 }
        confidence: { enum: [high, medium, low] }
        evidence: { type: array, items: { type: string } }
  their_values:
    type: array
    items: { type: string }
  their_red_lines:
    type: array
    items: { type: string }
  behavior_patterns:
    type: array
    items: { type: string }
